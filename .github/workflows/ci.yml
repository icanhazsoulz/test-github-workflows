name: test-ci-workflow-access
on:
  push:
    branches:
      - main
    paths:
      - 'plugin/**'
  release:
    types:
      - published

jobs:
    check-modified-files:
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      outputs:
        files_modified: ${{ steps.check_files.outputs.run_publish_steps }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Check modified files
          id: check_files
          run: |
            git fetch origin main
            changed_files_v1=$(git diff --name-only origin/main)
            changed_files_v2=$(git diff --name-only HEAD^)
            echo "Changed files old: ${changed_files_v1}"
            echo "Changed files new: ${changed_files_v2}"
            checked_directory="plugin/"
            for file in ${changed_files_v2}
            do
              if [[ ${file} == ${checked_directory}* ]]
              then
                echo "Target directory was modified."
                echo "run_publish_steps=true" >>$GITHUB_OUTPUT
                exit 0
              fi
            done
            echo "Target directory was not modified."
            echo "run_publish_steps=false" >>$GITHUB_OUTPUT
            echo "GITHUB_OUTPUT path="
            echo $GITHUB_OUTPUT
          shell: bash

    print_result:
      if: needs.check-modified-files.outputs.files_modified == 'true'
      runs-on: ubuntu-latest
      needs: [check-modified-files]
      steps:
        - name: Print result
          run: echo "The plugin/ directory was modified in this push!"

    check-modified-release-files:
      runs-on: ubuntu-latest
      if: >
        github.event_name == 'release' &&
        github.event.action == 'published'
      outputs:
        files_modified: ${{ steps.check_files.outputs.run_publish_steps }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Check modified files
          id: check_files
          run: |
            git fetch --tags
            tags=$(git tag --sort=-creatordate | head -n 2)
            previous_tag=$(echo "$tags" | tail -n 1)
            echo "Previous tag: $previous_tag"
            changed_files=$(git diff --name-only $previous_tag HEAD)
            echo "Changed files: ${changed_files}"
            checked_directory="plugin/"
            for file in ${changed_files}
            do
              if [[ ${file} == ${checked_directory}* ]]
              then
                echo "Target directory was modified."
                echo "run_publish_steps=true" >>$GITHUB_OUTPUT
                echo "GITHUB_OUTPUT path=$GITHUB_OUTPUT"
                exit 0
              fi
            done
            echo "Target directory was not modified."
            echo "run_publish_steps=false" >>$GITHUB_OUTPUT
            echo "dist=/tmp/bavp/dist" >>$GITHUB_OUTPUT
          shell: bash

    print_release_result:
      if: needs.check-modified-release-files.outputs.files_modified == 'true'
      needs: [check-modified-release-files]
      runs-on: ubuntu-latest
      name: Publish released package
      steps:
        - name: Print release result
          run: echo "The plugin/ directory was modified in this release!"